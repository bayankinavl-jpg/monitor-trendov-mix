# Словарь вкладки «Тренды»: бизнесовые и рыночные темы и конкуренты.
# Правка действует при следующей сборке страницы (после запуска парсера
# или командой python scripts/build_landing.py): все сохранённые статьи
# размечаются заново, ничего пересобирать вручную не нужно.
#
# themes — о ЧЁМ пишут. Слова сравниваются по нормальной форме, как в
#   keywords.yml: «маркетплейс» найдёт «маркетплейсы», «маркетплейсах».
#   Фраза из нескольких слов находится, если её слова идут подряд.
#   Тема упомянута, если в заголовке или тексте статьи есть любое её слово.
#   with_competitor: true — тема засчитывается, только если в той же
#   статье назван конкурент из списка ниже («сбой» у Сбера — да, сбой у
#   хостинга — нет).
#
# competitors — КТО упоминается. Названия ищутся как написаны (без учёта
#   регистра), с русскими окончаниями: «Модульбанк» найдёт «Модульбанка».
#   Короткие и многозначные названия пишите с уточнением («банк Синара»),
#   иначе будут ложные совпадения.
#   self: true — это мы (Точка): строка показывается как точка отсчёта.
#
# Что считается трендом (сравнение выбранного периода с таким же
# предыдущим, например месяц к прошлому месяцу):
#   новая      — раньше упоминаний не было, сейчас ≥3 упоминаний в ≥3 источниках
#   растёт     — доля статей с темой выросла вдвое, ≥3 источника
#   устойчивая — ≥5 упоминаний в ≥3 источниках, без резкого роста или падения
#   снижается  — доля статей с темой упала вдвое (было ≥3 упоминаний)
#   Доля = статьи с темой / все прочитанные статьи за период: так тренд не
#   зависит от того, сколько статей удалось собрать в конкретный день.

themes:
  # ---- Опт и производство ----
  - label: Маркетплейсы и онлайн-продажи B2B
    sphere: Опт и производство
    words: [маркетплейс, wildberries, ozon, яндекс маркет, оптовая онлайн-торговля, b2b-платформа]
  - label: Импортозамещение и локализация
    sphere: Опт и производство
    words: [импортозамещение, локализация производства, российский аналог, замещение импорта]
  - label: Параллельный импорт и новые цепочки поставок
    sphere: Опт и производство
    words: [параллельный импорт, поставщик из китая, закупки в китае, поставки из китая, цепочка поставок]
  - label: Рост издержек и цен
    sphere: Опт и производство
    words: [рост цен, подорожание, удорожание, себестоимость, рост издержек, инфляция]
  - label: Спрос и потребление
    sphere: Опт и производство
    words: [потребительский спрос, снижение спроса, падение спроса, рост спроса, падение продаж, рост продаж]
  - label: Промышленность и станкостроение
    sphere: Опт и производство
    words: [промышленное производство, станкостроение, загрузка мощностей, новый завод, промышленный парк]
  - label: Кадры и рынок труда
    sphere: Опт и производство
    words: [дефицит кадров, нехватка кадров, нехватка рабочих, рост зарплат, рынок труда, безработица]
  - label: Сельское хозяйство и продовольствие
    sphere: Опт и производство
    words: [урожай, экспорт зерна, цены на продукты, агросектор, аграрий, апк]

  # ---- IT ----
  - label: Искусственный интеллект
    sphere: IT
    words: [искусственный интеллект, нейросеть, генеративный ии, ии-ассистент, ии-агент, gigachat, yandexgpt]
  - label: Российское ПО и облака
    sphere: IT
    words: [российское по, отечественное по, облачный сервис, облачные технологии, дата-центр, цод, импортонезависимость]
  - label: Кибербезопасность
    sphere: IT
    words: [утечка данных, кибератака, ddos, фишинг, кибермошенничество, хакер]
  - label: Цифровые платформы и экосистемы
    sphere: IT
    words: [экосистема, суперапп, платформенная экономика, цифровая платформа]
  - label: Автоматизация бизнеса
    sphere: IT
    words: [автоматизация бизнеса, автоматизация, crm, цифровизация бизнеса, no-code, low-code, роботизация]

  # ---- Услуги и малый бизнес ----
  - label: Финансирование и кредиты для бизнеса
    sphere: Услуги и малый бизнес
    words: [кредит для бизнеса, кредитование бизнеса, льготное кредитование, кредитование мсп, ставка по кредиту, бизнес-кредит]
  - label: Платежи и расчёты
    sphere: Услуги и малый бизнес
    words: [эквайринг, сбп, система быстрых платежей, оплата по qr, qr-код, платёжный сервис, комиссия за платёж]
  - label: Налоги и режимы для малого бизнеса
    sphere: Услуги и малый бизнес
    words: [усн, упрощенка, нпд, самозанятый, налоговая нагрузка, патентная система]
  - label: Реклама и маркетинг
    sphere: Услуги и малый бизнес
    words: [рекламный рынок, маркетинг, продвижение, таргетированная реклама, медийная реклама, бренд]
  - label: Электронная коммерция и розница
    sphere: Услуги и малый бизнес
    words: [e-commerce, электронная коммерция, онлайн-торговля, интернет-торговля, розничная торговля, пункт выдачи, пвз]
  - label: Общепит и сервис
    sphere: Услуги и малый бизнес
    words: [ресторан, фудтех, общепит, общественное питание, horeca, кофейня, доставка еды]
  - label: Франшизы и малый бизнес
    sphere: Услуги и малый бизнес
    words: [франшиза, франчайзинг, стартап, малый бизнес, мсп, предприниматель, ип]

  # ---- Сквозные ----
  - label: Санкции и внешняя торговля
    sphere: Сквозные
    words: [санкции, санкционный, внешняя торговля, экспорт, импорт, курс рубля]
  - label: Устойчивое развитие и ESG
    sphere: Сквозные
    words: [esg, устойчивое развитие, переработка отходов, углеродный след, экологичность]
  - label: Банкротства и уход с рынка
    sphere: Сквозные
    words: [банкротство, закрытие бизнеса, уход с рынка, ликвидация компании, закрыть бизнес]
  - label: Господдержка бизнеса
    sphere: Сквозные
    words: [меры поддержки, господдержка, грант, субсидия, льготная программа, корпорация мсп]

  # ---- Конкуренты: что делают ----
  - label: Продукты и тарифы банков для бизнеса
    sphere: Конкуренты
    with_competitor: true
    words: [тариф для бизнеса, расчётный счёт, расчетный счет, рко, бесплатное обслуживание, кэшбэк для бизнеса, бизнес-карта]
  - label: Запуск новых B2B-сервисов
    sphere: Конкуренты
    with_competitor: true
    words: [запустил сервис, запустить сервис, новый сервис, новая функция, сервис для бизнеса, платформа для бизнеса]
  - label: Партнёрства и сделки
    sphere: Конкуренты
    with_competitor: true
    words: [партнёрство, партнерство, слияние, поглощение, сделка, интеграция с]
  - label: Сбои и жалобы
    sphere: Конкуренты
    with_competitor: true
    words: [сбой, блокировка счёта, блокировка счета, жалоба клиента, отзыв лицензии, 115-фз]
  - label: Цены и условия обслуживания
    sphere: Конкуренты

# Источники RSS для сканера новостей (см. tz_news_parser.md).
# Правка этого файла действует со следующего запуска, без изменения кода.
#
# trust_tier влияет на оценку достоверности (pipeline/credibility.py):
#   primary_source       — портал официального опубликования pravo.gov.ru:
#                           запись ленты — сам акт со ссылкой на текст
#   official_publication — официальное опубликование федеральных законов
#                           (и для РГ — постановлений Правительства)
#   legal                — правовые системы (Гарант, КонсультантПлюс)
#   general               — остальные СМИ

sources:
  # Портал официального опубликования. Адрес ленты:
  # http://publication.pravo.gov.ru/api/rss?block=<раздел>&pageSize=200
  # (адрес /rss — HTML-страница, не лента). Каждая лента — 200 последних
  # актов; лента министерств и служб покрывает около 10 дней, поэтому
  # запускать не реже раза в неделю. Ленту Конституционного Суда не
  # подключаем (судебная практика вне охвата ТЗ).
  - name: pravo_government
    title: "pravo.gov.ru: Правительство"
    focus: Акты Правительства
    feed_url: http://publication.pravo.gov.ru/api/rss?block=government&pageSize=200
    trust_tier: primary_source

  - name: pravo_president
    title: "pravo.gov.ru: Президент и законы"
    focus: Акты Президента и федеральные законы
    feed_url: http://publication.pravo.gov.ru/api/rss?block=president&pageSize=200
    trust_tier: primary_source

  - name: pravo_federal_authorities
    title: "pravo.gov.ru: министерства и службы"
    focus: Акты министерств и служб
    feed_url: http://publication.pravo.gov.ru/api/rss?block=federal_authorities&pageSize=200
    trust_tier: primary_source

  # council_1 — Совет Федерации, council_2 — Государственная Дума
  # (проверено 11.10.2026). pageSize меньше 10 портал не принимает.
  - name: pravo_federation_council
    title: "pravo.gov.ru: Совет Федерации"
    focus: Постановления Совета Федерации
    feed_url: http://publication.pravo.gov.ru/api/rss?block=council_1&pageSize=200
    trust_tier: primary_source

  - name: pravo_state_duma
    title: "pravo.gov.ru: Госдума"
    focus: Постановления Государственной Думы
    feed_url: http://publication.pravo.gov.ru/api/rss?block=council_2&pageSize=200
    trust_tier: primary_source


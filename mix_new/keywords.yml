# Ключевые слова для отбора регуляторных новостей (см. tz_news_parser.md).
# Правка этого файла действует со следующего запуска, без изменения кода.
#
# Слова ищутся по основе (без учёта регистра, ё заменяется на е), кроме
# раздела abbreviations — те ищутся целым словом.
#
# Новость проходит отбор, если есть слово из changes ИЛИ stages,
# И слово из acts_and_bodies ИЛИ topics ИЛИ industries,
# И нет слов из exclusions.

acts_and_bodies:
  - федеральный закон
  - законопроект
  - указ президента
  - постановление правительства
  - распоряжение правительства
  - приказ
  - минпромторг
  - минфин
  - фнс
  - фтс
  - минсельхоз
  - россельхознадзор
  - роспотребнадзор
  - минстрой
  - росстандарт
  - минприроды
  - росприроднадзор
  - решение совета еэк
  - решение коллегии еэк
  - технический регламент

stages:
  - проект постановления
  - общественное обсуждение
  - внесен в госдум
  - первое чтение
  - второе чтение
  - третье чтение
  - госдума приняла
  - совет федерации одобрил
  - подписал закон
  - опубликован
  - вступает в сил
  - вступил в сил
  - утратил силу
  - перенес срок

changes:
  - ставк
  - пошлин
  - сбор
  - перечень
  - запрет
  - ограничени
  - квот
  - лицензировани
  - обязан
  - порог
  - норматив
  - срок

topics:
  - упрощенная система
  - патент
  - страховые взносы
  - маркировк
  - честный знак
  - разрешительный режим
  - технологический сбор
  - экологический сбор
  - утилизаци
  - расширенная ответственность
  - комплексное экологическое разрешение
  - прослеживаемост
  - локализаци
  - реестр российской промышленной продукции
  - национальный режим
  - госзакупк
  - электронная транспортная накладная
  - утилизационный сбор
  - сертификаци
  - декларировани соответствия
  - маркетплейс
  - платформенная экономика
  - акциз

# Аббревиатуры ищутся целым словом (без поиска по основе), иначе совпадут
# с частью других слов.
abbreviations:
  - НДС
  - ЕГАИС
  - ВетИС
  - Меркурий

exclusions:
  - спорт
  - шоу-бизнес
  - гороскоп
  - губернатор
  - областной закон
  - краевой закон
  - муниципальн
  - администрация города
  - городская дума
  - назначен на должность
  - освобожден от должности
  - награжден
  - суд постановил
  - арбитражный суд

# Отрасли: слова → коды ОКВЭД. Привязывает новость к отрасли/сегменту.
industries:
  - words: [одежда, обувь, текстиль, кожа, мех]
    okved: ["13", "14", "15", "46.4"]
  - words: [молочная продукция, мясо, хлеб, напитки, пиво, алкоголь, рыба, масложировая]
    okved: ["10", "11", "46.3"]
  - words: [косметика, парфюмерия, бытовая химия]
    okved: ["20.41", "20.42", "46.4"]
  - words: [электроника, бытовая техника, компьютеры, смартфоны]
    okved: ["26", "27", "46.5"]
  - words: [стройматериалы, цемент, лакокрасочные материалы]
    okved: ["23", "20.30", "46.73"]
  - words: [упаковка, тара]
    okved: ["17.21", "22.22", "23.13"]
  - words: [автозапчасти, шины]
    okved: ["45.3", "22.11"]
  - words: [зерно, семена, удобрения, корма]
    okved: ["46.2", "10.9", "20.15"]
  - words: [металл, металлопрокат]
    okved: ["24", "25", "46.72"]

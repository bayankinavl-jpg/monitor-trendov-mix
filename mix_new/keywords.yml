# Отрасли: слова → коды ОКВЭД. Привязывает новость к нише.
# label — название ниши в выгрузке и на странице.
# sphere — сфера, в которую ниша входит (заголовок раздела на странице);
# без sphere ниша относится к сфере «Опт и производство».
industries:
  - label: Одежда, обувь, текстиль
    words: [одежда, обувь, текстиль, кожа, мех]
    okved: ["13", "14", "15", "46.4"]
  - label: Продукты питания и напитки

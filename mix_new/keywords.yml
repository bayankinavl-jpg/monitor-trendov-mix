topics:
  - упрощенная система
  - патент
  - страховые взносы
  - маркировка
  - честный знак
  - разрешительный режим
  - технологический сбор
  - экологический сбор
  - утилизация
  - расширенная ответственность
  - комплексное экологическое разрешение
  - прослеживаемость
  - локализация
  - реестр российской промышленной продукции
  - национальный режим
  - госзакупки
  - электронная транспортная накладная
  - утилизационный сбор
  - сертификация
  - декларирование соответствия
  - маркетплейс
  - платформенная экономика
  - акциз

abbreviations:

  - от должности
  - исполняющий обязанности
  - досрочное прекращение полномочий
  - награжден
  - награждение
  - суд постановил
  - арбитражный суд

# Отрасли: слова → коды ОКВЭД. Привязывает новость к суб-сегменту.
# label — название отрасли в выгрузке.
industries:
  - label: Одежда, обувь, текстиль
    words: [одежда, обувь, текстиль, кожа, мех]
    okved: ["13", "14", "15", "46.4"]
  - label: Продукты питания и напитки
    words: [молочная продукция, мясо, хлеб, напитки, пиво, вино, алкоголь, рыба, масложировая продукция]
    okved: ["10", "11", "46.3"]
  - label: Косметика и бытовая химия
    words: [косметика, парфюмерия, бытовая химия]
    okved: ["20.41", "20.42", "46.4"]
  - label: Электроника и бытовая техника
    words: [электроника, бытовая техника, компьютеры, смартфоны]
    okved: ["26", "27", "46.5"]
  - label: Стройматериалы
    words: [стройматериалы, цемент, лакокрасочные материалы]
    okved: ["23", "20.30", "46.73"]
  - label: Упаковка и тара
    words: [упаковка, тара]
    okved: ["17.21", "22.22", "23.13"]
  - label: Автозапчасти и шины
    words: [автозапчасти, шины]
    okved: ["45.3", "22.11"]
  - label: Зерно, семена, удобрения, корма
    words: [зерно, семена, удобрения, корма]
    okved: ["46.2", "10.9", "20.15"]
  - label: Металл и металлопрокат
    words: [металл, металлопрокат]
    okved: ["24", "25", "46.72"]

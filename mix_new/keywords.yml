  - первое чтение
  - второе чтение
  - третье чтение
  - госдума приняла
  - совет федерации одобрил
  - одобрение федерального закона
  - подписал закон
  - опубликован
  - вступает в силу
  - вступил в силу
  - утратил силу
  - перенес срок

changes:

# Ключевые слова для отбора регуляторных новостей (см. tz_news_parser.md).
# Правка этого файла действует со следующего запуска, без изменения кода.
#
# Слова сравниваются по нормальной форме: «ставка» найдёт «ставки»,
# «ставку», «ставкам». Писать слово можно в любой форме. Фраза из
# нескольких слов найдётся, если её слова стоят в тексте подряд.
# Раздел abbreviations ищется целым словом без приведения к нормальной форме.
#
# Новость проходит отбор, только если выполнены ВСЕ три условия:
#   1. В ЗАГОЛОВКЕ есть признак регуляторного изменения: слово из markers
#      (вид акта: закон, приказ, правила) или из stages (чтение, вступает
#      в силу), либо глагол из actions («утвердил», «обязать») при названном
#      органе в тексте.
#   2. Есть предмет: слово из topics, industries или abbreviations
#      ЛИБО орган из acts_and_bodies вместе со словом из changes.
#      Виды актов («федеральный закон») органами не считаются.
#   3. Нет слов из exclusions.
# Одно название органа или слово «ставка» новость не пропускает.
#
# Сейчас собираются только акты РФ. Слова о решениях ЕЭК и технических
# регламентах ЕАЭС удалены.

